/* =================== wizard =================== */
function pick(o){
  var cls='pick'+(o.on?' on':'')+(o.locked?' locked':'')+(o.alt?' pick-alt':'');
  return '<label class="'+cls+'">'
    +'<input type="'+o.type+'" name="'+(o.name||'')+'" value="'+(o.value||'')+'" '
      +(o.on?'checked':'')+' '+(o.locked?'disabled':'')+' data-act="'+o.act+'">'
    +'<span class="pick-mark">'+icoCheck(14)+'</span>'
    +(o.face?'<span class="pick-face">'+portrait(o.face,'square')+'</span>':'')
    +'<span class="pick-body">'
      +(o.title?'<span class="pick-title">'+o.title+'</span>':'')
      +(o.text?'<span class="pick-text">'+o.text+'</span>':'')
      +(o.read?'<span class="pick-read" data-act="read" data-v="'+o.read+'" role="button" tabindex="0">'+esc(tx(T.wiz.readFull))+'</span>':'')
    +'</span>'
    +(o.flag?'<span class="pick-flag">'+esc(o.flag)+'</span>':'')+'</label>';
}

function evPicks(chosen,none,act,actNone,noneLabel,src,exclude){
  var who=src.who; exclude=exclude||[];
  if(!S.opened.length) return '<p class="empty-note">'+esc(tx(T.wiz.noOpened))+'</p>'
    +pick({type:'checkbox',on:none,act:actNone,alt:true,title:esc(tx(noneLabel))});
  var rows=S.opened.map(function(id){
    var e=EV[id], on=chosen.indexOf(id)>-1;
    var taken=!on&&exclude.indexOf(id)>-1;
    var locked=(!on&&chosen.length>=2)||none||taken;
    return pick({type:'checkbox',value:id,on:on,locked:locked,act:act,
      title:esc(tx(PEOPLE[e.who].name))+' — '+esc(tx(KIND[e.factor])),
      text:esc(tx(e.text)).slice(0,150)+'…', read:id,
      flag:taken?tx(T.wiz.alreadyFiled):((who&&e.who!==who)?tx({ar:'عن قائد تاني',en:'another leader'}):'')});
  }).join('');
  return rows+pick({type:'checkbox',on:none,act:actNone,alt:true,title:esc(tx(noneLabel))});
}

function chips(src){
  var out=[];
  if(src.who) out.push('<span class="wiz-chip">'+esc(tx(T.k.leader))+': <b>'+esc(tx(PEOPLE[src.who].name))+'</b></span>');
  if(src.evSup.length||src.noSup) out.push('<span class="wiz-chip">'+esc(tx(T.k.supports))+': <b>'+(src.noSup?esc(tx(T.k.none)):src.evSup.length)+'</b></span>');
  if(src.evLim.length||src.noLim) out.push('<span class="wiz-chip">'+esc(tx(T.k.limits))+': <b>'+(src.noLim?esc(tx(T.k.none)):src.evLim.length)+'</b></span>');
  return out.length?'<div class="wiz-chosen">'+out.join('')+'</div>':'';
}

function stepBody(n,src,prefix){
  var a=prefix||'';
  if(n===1){
    return ORDER.map(function(id){
      return pick({type:'radio',name:a+'who',value:id,on:src.who===id,act:a+'who',face:id,
        title:esc(tx(PEOPLE[id].name)),text:esc(pipsLabel(openedOf(id).length))});
    }).join('');
  }
  if(n===2) return evPicks(src.evSup,src.noSup,a+'evs',a+'nos',T.wiz.alt2,src,src.evLim);
  if(n===3) return evPicks(src.evLim,src.noLim,a+'evl',a+'nol',T.wiz.alt3,src,src.evSup);
  if(n===4){
    if(!src.who) return '';
    var list=coverageNote(src.who)+CONCLUSIONS.map(function(o){
      return pick({type:'radio',name:a+'con',value:o.id,on:src.conclusion===o.id,act:a+'con',
        text:esc(tx(o.text))});
    }).join('');
    if(src.conclusion==='c_no'){
      list+='<div class="followup"><p class="followup-q">'+esc(tx(T.wiz.cnoQ))+'</p>'
        +CNO_PATHS.map(function(o){
          return pick({type:'radio',name:a+'cno',value:o.id,on:src.cnoPath===o.id,act:a+'cno',
            text:esc(tx(o.text))});
        }).join('')
        +(src.cnoPath==='cno_cond'
          ? '<p class="followup-q" style="margin-block:var(--s4) var(--s3)">'+esc(tx(T.wiz.cnoCheckQ))+'</p>'
            +CNO_CHECKS.map(function(o){
              return pick({type:'radio',name:a+'cnoc',value:o.id,on:src.cnoCheck===o.id,act:a+'cnoc',
                text:esc(tx(o.text))});
            }).join('')
          : '')
        +'</div>';
    }
    return list;
  }
  if(n===5){
    if(!src.who) return '';
    return (S.supOrder[src.who]||[]).map(function(id){
      return pick({type:'radio',name:a+'sup',value:id,on:src.support===id,act:a+'sup',
        text:esc(tx(supportText(id)))});
    }).join('');
  }
  if(n===6){
    if(!src.who) return '';
    return (S.mvOrder[src.who]||[]).map(function(id){
      return pick({type:'radio',name:a+'mv',value:id,on:src.move===id,act:a+'mv',
        text:esc(tx(moveTextOf(id)))});
    }).join('');
  }
  if(n===7){
    return (S.plOrder||[]).map(function(id){
      return pick({type:'radio',name:a+'pl',value:id,on:src.pledge===id,act:a+'pl',
        text:esc(tx(pledgeText(id)))});
    }).join('');
  }
  return '';
}

/* Shows ONLY what the participant has actually opened, so the step
   never leaks a fact from an unopened record. */
function coveredFactors(who){
  return FACTORS.filter(function(f){ return S.opened.indexOf(who+'_'+f)>-1; });
}
function missingFactors(who){
  return FACTORS.filter(function(f){ return S.opened.indexOf(who+'_'+f)===-1; });
}
function coverageNote(who){
  var have=coveredFactors(who), miss=missingFactors(who);
  var parts=[];
  if(have.length) parts.push('<b>'+esc(tx(T.wiz.covHave))+'</b> '+esc(have.map(function(f){return tx(FACTOR_NAME[f]);}).join(sep())));
  if(miss.length) parts.push('<b>'+esc(tx(T.wiz.covMiss))+'</b> '+esc(miss.map(function(f){return tx(FACTOR_NAME[f]);}).join(sep())));
  if(!parts.length) return '';
  return '<div class="coverage">'+parts.join('<span class="cov-sep"></span>')+'</div>';
}

function stepQ(n){ return [null,T.wiz.q1,T.wiz.q2,T.wiz.q3,T.wiz.q4,T.wiz.q5,T.wiz.q6,T.wiz.q7][n]; }
function stepH(n){ return [null,T.wiz.h1,T.wiz.h2,T.wiz.h3,T.wiz.h4,T.wiz.h5,T.wiz.h6,T.wiz.h7][n]; }
function stepErr(n){ return [null,T.wiz.e1,T.wiz.e2,T.wiz.e3,T.wiz.e4,T.wiz.e5,T.wiz.e6,T.wiz.e7][n]; }

function stepValid(n,src){
  if(n===1) return !!src.who;
  if(n===2) return src.noSup||src.evSup.length>0;
  if(n===3) return src.noLim||src.evLim.length>0;
  if(n===4){
    if(!src.conclusion) return false;
    if(src.conclusion!=='c_no') return true;
    if(!src.cnoPath) return false;
    if(src.cnoPath==='cno_cond' && !src.cnoCheck) return false;
    return true;
  }
  if(n===5) return !!src.support;
  if(n===6) return !!src.move;
  if(n===7) return !!src.pledge;
  return true;
}

function sumRows(sn){
  return '<div class="sum-row"><span class="sum-k">'+esc(tx(T.k.leader))+'</span><span class="sum-v">'+esc(tx(PEOPLE[sn.who].name))+'</span></div>'

      +'<span class="readout-who">'+esc(tx(PEOPLE[e.who].name))+' — '+esc(tx(KIND[e.factor]))+'</span>'

      +'<p>'+esc(tx(T.res.otherPerson))+'</p></div>';

     filed it under, then their filing is commented on separately. */

    +'<span class="readout-who">'+esc(tx(PEOPLE[e.who].name))+' — '+esc(tx(KIND[e.factor]))+'</span>'

/* =================== reflection =================== */
function reflectBlock(sn){
  var who=tx(PEOPLE[sn.who].name);
  var nOwn=sn.openedAt.filter(function(id){return EV[id].who===sn.who;}).length;
  var miss=FACTORS.filter(function(f){return sn.openedAt.indexOf(sn.who+'_'+f)===-1;});
  var c1=nOwn?tx(T.reflect.c1).replace('{n}',nOwn):tx(T.reflect.c1none);
  var c2=miss.length?tx(T.reflect.c2).replace('{f}',miss.map(function(f){return tx(FACTOR_NAME[f]);}).join(sep())):tx(T.reflect.c2all);
  var qs=[
    {k:'r1',q:tx(T.reflect.q1).replace('{who}',who),c:c1},
    {k:'r2',q:tx(T.reflect.q2),c:c2},
    {k:'r3',q:tx(T.reflect.q3),c:tx(T.reflect.c3)}
  ];
  return '<div class="reflect"><h3>'+esc(tx(T.reflect.title))+'</h3>'
    +'<p class="lede">'+esc(tx(T.reflect.lede))+'</p>'
    +qs.map(function(o){
      var v=(S.notes&&S.notes[o.k])||'';
      return '<div class="rq"><label for="n-'+o.k+'"><span class="rq-q">'+esc(o.q)+'</span>'
        +'<span class="rq-ctx">'+esc(o.c)+'</span></label>'
        +'<textarea id="n-'+o.k+'" data-act="note" data-v="'+o.k+'" rows="3" placeholder="'+esc(tx(T.reflect.placeholder))+'">'+esc(v)+'</textarea>'
        +'<span class="rq-count">'+(v?esc(tx(T.reflect.saved)):'')+'</span></div>';
    }).join('')
    +'<p class="reflect-note">'+esc(tx(T.reflect.note))+'</p></div>';
}

/* =================== dialog / reader =================== */
var lastFocus=null;
function closeLayer(){
  var l=$('layer'); if(!l.innerHTML) return;
  SFX.close();
  if(l._esc) document.removeEventListener('keydown',l._esc);
  l.innerHTML=''; l._esc=null;
  if(lastFocus&&lastFocus.focus) lastFocus.focus();
}
function mountLayer(html,boxSel,onAct){
  lastFocus=document.activeElement;
  var l=$('layer'); l.innerHTML=html;
  var scrim=l.firstElementChild, box=l.querySelector(boxSel);
  scrim.addEventListener('click',function(e){ if(e.target===scrim) closeLayer(); });
  box.addEventListener('click',function(e){
    var el=e.target.closest('[data-dlg]'); if(!el) return;
    if(el.dataset.dlg==='no'){ closeLayer(); return; }
    if(onAct) onAct(el.dataset.dlg,el);
  });
  l._esc=function(e){
    if(e.key==='Escape'){ closeLayer(); return; }
    if(e.key==='Tab'){
      var f=box.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');
      if(!f.length) return;
      var a=f[0],z=f[f.length-1];
      if(e.shiftKey&&document.activeElement===a){ e.preventDefault(); z.focus(); }
      else if(!e.shiftKey&&document.activeElement===z){ e.preventDefault(); a.focus(); }
    }
  };
  document.addEventListener('keydown',l._esc);
  setTimeout(function(){ if(box.focus) box.focus(); },20);
}
function dialog(html,onAct){
  mountLayer('<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" tabindex="-1">'+html+'</div></div>','.dialog',onAct);
}
function toast(msg){
  $('toast-layer').innerHTML='<div class="toast"><div>'+esc(msg)+'</div></div>';
  setTimeout(function(){ $('toast-layer').innerHTML=''; },2600);
}

/* =================== reveal =================== */
var busy=false;
/* One click on the question opens the record. The cost is shown on the
   button itself, so a confirmation step would only add friction. */
function askReveal(id){
  if(busy||S.opened.indexOf(id)>-1||S.budget<=0) return;
  doReveal(id);
}
function doReveal(id){
  if(busy||S.opened.indexOf(id)>-1||S.budget<=0) return;
  busy=true;
  var dock=$('dock'), orb=dock?dock.querySelectorAll('.orb')[S.budget-1]:null;
  SFX.spend();
  if(orb&&!rm()){ orb.classList.add('spending'); try{ flySpark(orb); }catch(e){} }
  S.opened.push(id); S.budget-=1; save();
  setTimeout(function(){
    draw(); openReader(id); SFX.open();
    say(S.budget<=0?tx(T.inv.out):tx(leftLabel()));
    busy=false;
  }, rm()?0:430);
}
function flySpark(from){
  if(typeof Element==='undefined'||!Element.prototype.animate) return;
  var target=document.querySelector('[data-act="vault"]'); if(!target) return;
  var a=from.getBoundingClientRect(), b=target.getBoundingClientRect();
  var s=document.createElement('span'); s.className='spark';
  s.style.left=(a.left+a.width/2-6)+'px'; s.style.top=(a.top+a.height/2-6)+'px';
  document.body.appendChild(s);
  var dx=(b.left+b.width/2)-(a.left+a.width/2), dy=(b.top+b.height/2)-(a.top+a.height/2);
  s.animate([{transform:'translate(0,0) scale(1)',opacity:1},
    {transform:'translate('+(dx*.5)+'px,'+(dy*.5-50)+'px) scale(1.6)',opacity:.95,offset:.55},
    {transform:'translate('+dx+'px,'+dy+'px) scale(.3)',opacity:0}],
    {duration:640,easing:'cubic-bezier(.4,0,.2,1)'}).onfinish=function(){ s.remove(); };
}

/* ======================================================================
   SOUND — every cue is synthesised with WebAudio, so the file stays
   self-contained. The context is only created after a real user
   gesture, and nothing plays while the toggle is off.
   ====================================================================== */
var AC=null, master=null;
function audioReady(){
  if(S.sfx===false) return false;
  try{
    if(!AC){
      var Ctx=window.AudioContext||window.webkitAudioContext;
      if(!Ctx) return false;
      AC=new Ctx();
      master=AC.createGain();
      master.gain.value=0.5;
      master.connect(AC.destination);
    }
    if(AC.state==='suspended') AC.resume();
    return true;
  }catch(e){ return false; }
}
function tone(freq,dur,type,vol,delay,slideTo){
  if(!AC) return;
  var t0=AC.currentTime+(delay||0);
  var o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(freq,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol||0.05,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0+dur+0.02);
}
function noiseSwell(dur,vol){
  if(!AC) return;
  var n=Math.floor(AC.sampleRate*dur);
  var buf=AC.createBuffer(1,n,AC.sampleRate), ch=buf.getChannelData(0);
  for(var i=0;i<n;i++){ ch[i]=(Math.random()*2-1)*(1-i/n); }
  var src=AC.createBufferSource(); src.buffer=buf;
  var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200; f.Q.value=0.8;
  var g=AC.createGain(); g.gain.value=vol||0.03;
  src.connect(f); f.connect(g); g.connect(master);
  src.start();
}
var SFX={
  tap:function(){ if(audioReady()) tone(520,0.07,'sine',0.035); },
  step:function(){ if(audioReady()){ tone(440,0.09,'sine',0.04); tone(660,0.12,'sine',0.032,0.07); } },
  back:function(){ if(audioReady()){ tone(520,0.09,'sine',0.035); tone(390,0.12,'sine',0.03,0.06); } },
  open:function(){ if(audioReady()){ noiseSwell(0.3,0.025); tone(300,0.26,'sine',0.04,0,520); } },
  spend:function(){ if(audioReady()){ tone(760,0.1,'triangle',0.04); tone(380,0.3,'sine',0.03,0.06); } },
  select:function(){ if(audioReady()) tone(620,0.06,'triangle',0.03); },
  confirm:function(){ if(audioReady()){ tone(523.25,0.14,'sine',0.04); tone(659.25,0.14,'sine',0.038,0.09); tone(783.99,0.26,'sine',0.036,0.18); } },
  error:function(){ if(audioReady()){ tone(200,0.14,'square',0.028); tone(160,0.18,'square',0.024,0.1); } },
  close:function(){ if(audioReady()) tone(340,0.1,'sine',0.028,0,250); }
};

/* ======================================================================
   RIPPLE + TILT + POINTER SHEEN
   ====================================================================== */
function ripple(el,ev){
  if(rm()||!el) return;
  try{
    var r=el.getBoundingClientRect();
    var size=Math.max(r.width,r.height);
    var s=document.createElement('span');
    s.className='rip';
    s.style.width=s.style.height=size+'px';
    s.style.left=((ev.clientX||r.left+r.width/2)-r.left-size/2)+'px';
    s.style.top=((ev.clientY||r.top+r.height/2)-r.top-size/2)+'px';
    el.appendChild(s);
    setTimeout(function(){ s.remove(); },620);
  }catch(e){}
}
document.addEventListener('pointerdown',function(e){
  var el=e.target.closest('.btn,.cta,.pick,.ask-btn,.sw-btn');
  if(el) ripple(el,e);
},{passive:true});

document.addEventListener('pointermove',function(e){
  var el=e.target.closest('.scard,.person');
  if(!el||rm()) return;
  var r=el.getBoundingClientRect();
  el.style.setProperty('--mx',(e.clientX-r.left)+'px');
  el.style.setProperty('--my',(e.clientY-r.top)+'px');
  var rx=((e.clientY-r.top)/r.height-0.5)*-4;
  var ry=((e.clientX-r.left)/r.width-0.5)*4;
  el.style.transform='perspective(900px) rotateX('+rx+'deg) rotateY('+ry+'deg) translateY(-5px)';
},{passive:true});
document.addEventListener('pointerleave',function(e){
  var el=e.target.closest && e.target.closest('.scard,.person');
  if(el) el.style.transform='';
},true);

/* keeps the ambience in step with the stage */
function fxAfterDraw(){
  document.documentElement.setAttribute('data-stage',S.stage);
  var btn=$('sfx-toggle');
  if(btn){
    var on=S.sfx!==false;
    btn.setAttribute('aria-pressed',on?'true':'false');
    btn.setAttribute('aria-label',tx(on?T.nav.sfxOn:T.nav.sfxOff));
    btn.setAttribute('title',tx(on?T.nav.sfxOn:T.nav.sfxOff));
  }
}

/* =================== events =================== */
function closeMenus(){
  document.querySelectorAll('.pill-menu').forEach(function(m){ m.classList.remove('open'); });
  document.querySelectorAll('[data-act="menu"]').forEach(function(b){ b.setAttribute('aria-expanded','false'); });
}
function scrollTop(){ try{ window.scrollTo({top:0,behavior:rm()?'auto':'smooth'}); }catch(e){ try{window.scrollTo(0,0);}catch(e2){} } }

function handle(a,v,el){
  if(a==='sfx'){
    S.sfx=(S.sfx===false);
    save(); fxAfterDraw();
    if(S.sfx){ audioReady(); SFX.select(); }
    say(tx(S.sfx?T.nav.sfxOn:T.nav.sfxOff));
    return;
  }
  if(a==='menu'){ var mn=$(el.dataset.menu+'-menu'); if(!mn) return;
    var o=mn.classList.contains('open'); closeMenus();
    if(!o){ mn.classList.add('open'); el.setAttribute('aria-expanded','true'); } return; }
  if(a==='lang'){ closeMenus(); if(S.lang!==v){ S.lang=v; save(); draw(); say(v==='ar'?'العربية':'English'); } return; }
  if(a==='theme'){ closeMenus(); if(S.theme!==v){ S.theme=v; save(); draw(); } return; }
  if(a==='go'){ SFX.tap(); go(v); return; }
  if(a==='acc'){ S[v]=!S[v]; save(); draw(); return; }
  if(a==='ask'){ askReveal(v); return; }
  if(a==='read'){ SFX.open(); openReader(v); return; }
  if(a==='vault'){ SFX.tap(); openVault(); return; }
  if(a==='free'){ if(S.opened.indexOf(v)===-1){ S.opened.push(v); save(); draw(); } openReader(v); return; }

  if(a==='toDecide'){
    if(S.budget>0){
      dialog('<h3>'+esc(tx(T.inv.dlgLeftT))+'</h3><p>'+esc(tx(T.inv.dlgLeftB))+'</p>'
        +'<div class="dlg-cost"><span class="orbs">'+orbs(S.budget)+'</span><span>'+esc(tx(leftLabel()))+'</span></div>'
        +'<div class="btns"><button class="btn btn-primary" type="button" data-dlg="ok">'+esc(tx(T.inv.dlgLeftOk))+'</button>'
        +'<button class="btn btn-ghost" type="button" data-dlg="no">'+esc(tx(T.inv.dlgLeftNo))+'</button></div>',
        function(k){ if(k==='ok'){ closeLayer(); go('decide'); } });
    } else go('decide');
    return;
  }
  if(a==='prev'){ if(S.step>1){ SFX.back(); S.step--; S.dir=-1; S.errs={}; save(); draw(); scrollTop(); } return; }
  if(a==='next'){
    if(!stepValid(S.step,S)){ SFX.error(); S.errs={step:1}; save(); draw(); say(tx(stepErr(S.step))); return; }
    S.errs={};
    if(S.step===4 && S.conclusion==='c_no' && S.cnoPath==='cno_change'){
      SFX.back(); S.step=1; S.dir=-1; S.conclusion=null; S.cnoPath=null; S.cnoCheck=null; S.support=null; S.move=null;
      save(); draw(); scrollTop(); say(tx(T.wiz.q1)); return;
    }
    if(S.step<STEPS){ SFX.step(); S.step++; S.dir=1; save(); draw(); scrollTop(); return; }
    dialog('<h3>'+esc(tx(T.wiz.confirmT))+'</h3><p>'+esc(tx(T.wiz.confirmB))+'</p>'
      +'<div class="verdict-card" style="padding:var(--s4);margin-block-end:var(--s5)">'+sumRows(snap(S))+'</div>'
      +'<div class="btns"><button class="btn btn-primary" type="button" data-dlg="ok">'+esc(tx(T.wiz.confirmOk))+'</button>'
      +'<button class="btn btn-ghost" type="button" data-dlg="no">'+esc(tx(T.wiz.confirmNo))+'</button></div>',
      function(k){ if(k==='ok'){ closeLayer(); S.submitted=snap(S); S.revised=null; S.kept=false; S.revising=false; save(); go('result'); SFX.confirm(); } });
    return;
  }
  if(a==='keep'){ S.kept=true; save(); draw(); return; }
  if(a==='revise'){
    S.revising=true; S.errs={};
    S.buf={who:S.submitted.who,evSup:S.submitted.evSup.slice(),noSup:S.submitted.noSup,
      evLim:S.submitted.evLim.slice(),noLim:S.submitted.noLim,conclusion:S.submitted.conclusion,
      cnoPath:S.submitted.cnoPath,cnoCheck:S.submitted.cnoCheck,
      support:S.submitted.support,move:S.submitted.move,pledge:S.submitted.pledge};
    save(); draw(); return;
  }
  if(a==='revNo'){ S.revising=false; S.buf=null; S.errs={}; save(); draw(); return; }
  if(a==='revOk'){
    var errs={};
    for(var n=1;n<=STEPS;n++){ if(!stepValid(n,S.buf)) errs['r'+n]=1; }
    S.errs=errs; save();
    if(Object.keys(errs).length){ draw(); var e1=document.querySelector('.err');
      if(e1&&e1.scrollIntoView){ try{e1.scrollIntoView({block:'center',behavior:rm()?'auto':'smooth'});}catch(e){} } return; }
    SFX.confirm();
    S.revised=snap(S.buf); S.revised.openedAt=S.opened.slice();
    S.revising=false; S.buf=null; save(); draw(); scrollTop(); return;
  }
  if(a==='dl'){ download(); return; }
  if(a==='again'){
    dialog('<h3>'+esc(tx(T.res.againT))+'</h3><p>'+esc(tx(T.res.againB))+'</p>'
      +'<div class="btns"><button class="btn btn-primary" type="button" data-dlg="ok">'+esc(tx(T.res.againOk))+'</button>'
      +'<button class="btn btn-ghost" type="button" data-dlg="no">'+esc(tx(T.res.againNo))+'</button></div>',
      function(k){ if(k==='ok'){ var lg=S.lang,th=S.theme; S=fresh(); S.lang=lg; S.theme=th; save(); closeLayer(); go('start'); } });
    return;
  }
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  if(el.closest('[data-dlg]')&&el.dataset.act!=='read') return;
  handle(el.dataset.act,el.dataset.v,el);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key===' '){
    var el=e.target.closest('[role="button"][data-act]');
    if(el){ e.preventDefault(); handle(el.dataset.act,el.dataset.v,el); }
  }
});
document.addEventListener('click',function(e){ if(!e.target.closest('.pill-select')) closeMenus(); });
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&document.querySelector('.pill-menu.open')) closeMenus();
});

/* choice changes — preserved across steps */
function toggleEv(list,v,checked,clearFlag,src){
  var i=list.indexOf(v);
  if(checked){ if(list.length<2){ list.push(v); src[clearFlag]=false; } else { toast(tx(T.wiz.max)); } }
  else if(i>-1) list.splice(i,1);
}
document.addEventListener('input',function(e){
  var el=e.target.closest('[data-act="note"]'); if(!el) return;
  if(!S.notes) S.notes={};
  S.notes[el.dataset.v]=el.value;
  save();
  var c=el.parentNode.querySelector('.rq-count');
  if(c) c.textContent=el.value?tx(T.reflect.saved):'';
});
document.addEventListener('change',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.act==='note') return;
  var a=el.dataset.act, v=el.value, R=a.charAt(0)==='r', src=R?S.buf:S, k=R?a.slice(1):a;
  if(!src) return;
  if(k==='who'){ if(src.who!==v){ src.who=v; src.conclusion=null; src.cnoPath=null; src.cnoCheck=null; src.support=null; src.move=null; } }
  else if(k==='evs'){ toggleEv(src.evSup,v,el.checked,'noSup',src); }
  else if(k==='nos'){ src.noSup=el.checked; if(el.checked) src.evSup=[]; }
  else if(k==='evl'){ toggleEv(src.evLim,v,el.checked,'noLim',src); }
  else if(k==='nol'){ src.noLim=el.checked; if(el.checked) src.evLim=[]; }
  else if(k==='con'){ src.conclusion=v; if(v!=='c_no'){ src.cnoPath=null; src.cnoCheck=null; } }
  else if(k==='cno'){ src.cnoPath=v; if(v!=='cno_cond') src.cnoCheck=null; }
  else if(k==='cnoc'){ src.cnoCheck=v; }
  else if(k==='sup'){ src.support=v; }
  else if(k==='mv'){ src.move=v; }
  else if(k==='pl'){ src.pledge=v; }
  else return;
  SFX.select();
  if(!R) S.errs={};
  save(); draw();
});

/* =================== summary download =================== */
function download(){
  var sn=S.revised||S.submitted, lang=S.lang, dir=lang==='ar'?'rtl':'ltr';
  var font=lang==='ar'?"'Noto Sans Arabic',Tahoma,sans-serif":"'Inter',system-ui,sans-serif";
  function R(k,v){ return '<tr><th>'+esc(k)+'</th><td>'+v+'</td></tr>'; }
  function evList(ids,none){
    if(none) return esc(tx(T.k.none));
    if(!ids.length) return '—';
    return '<ul>'+ids.map(function(id){var e=EV[id];
      return '<li><b>'+esc(tx(PEOPLE[e.who].name))+' — '+esc(tx(KIND[e.factor]))+'</b><br>'+esc(tx(e.text))+'</li>';}).join('')+'</ul>';
  }
  var opened=S.submitted.openedAt.length
    ? '<ul>'+S.submitted.openedAt.map(function(id){var e=EV[id];
        return '<li><b>'+esc(tx(PEOPLE[e.who].name))+' — '+esc(tx(KIND[e.factor]))+'</b><br>'+esc(tx(e.text))+'</li>';}).join('')+'</ul>'
    : '<p>'+esc(tx(T.k.none))+'</p>';
  var notes='';
  if(S.notes){
    var keys=['r1','r2','r3'].filter(function(k){ return (S.notes[k]||'').trim(); });
    if(keys.length){
      notes='<h2>'+esc(tx(T.reflect.inSummary))+'</h2><ul>'
        +keys.map(function(k){ return '<li>'+esc(S.notes[k])+'</li>'; }).join('')+'</ul>';
    }
  }
  var rev=S.revised?('<h2>'+esc(tx(T.res.revised))+'</h2><table>'
    +R(tx(T.k.leader),esc(tx(PEOPLE[S.revised.who].name)))
    +R(tx(T.k.conclusion),esc(tx(conclusionText(S.revised.conclusion))))
    +R(tx(T.k.support),esc(tx(supportText(S.revised.support))))
    +R(tx(T.k.move),esc(tx(moveTextOf(S.revised.move))))+'</table>'):'';

  var doc='<!DOCTYPE html><html lang="'+lang+'" dir="'+dir+'"><head><meta charset="UTF-8">'
    +'<meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(tx(T.sum.title))+'</title><style>'
    +'body{font-family:'+font+';max-width:760px;margin:40px auto;padding:0 24px;color:#14142B;line-height:1.9;background:#fff}'
    +'h1{font-size:1.5rem;border-bottom:2px solid #4D88E8;padding-bottom:12px}h2{font-size:1.05rem;margin-top:34px}'
    +'table{width:100%;border-collapse:collapse;margin:16px 0}'
    +'th{text-align:start;width:30%;color:#555;font-size:.88rem;padding:12px;border-bottom:1px solid #e3e3ea;vertical-align:top}'
    +'td{padding:12px;border-bottom:1px solid #e3e3ea;vertical-align:top}'
    +'ul{margin:0;padding-inline-start:20px}li{margin-bottom:12px}.m{color:#666;font-size:.85rem}'
    +'@media print{body{margin:0}.noprint{display:none}}</style></head><body>'
    +'<h1>'+esc(tx(T.sum.title))+'</h1><h2>'+esc(tx(T.res.original))+'</h2><table>'
      +R(tx(T.k.leader),esc(tx(PEOPLE[S.submitted.who].name)))
      +R(tx(T.k.supports),evList(S.submitted.evSup,S.submitted.noSup))
      +R(tx(T.k.limits),evList(S.submitted.evLim,S.submitted.noLim))
      +R(tx(T.k.conclusion),esc(tx(conclusionText(S.submitted.conclusion)))
         +(S.submitted.cnoPath?'<br>'+esc(tx(byId(CNO_PATHS,S.submitted.cnoPath).text)):'')
         +(S.submitted.cnoCheck?'<br><b>'+esc(tx(T.k.condition))+'</b> '+esc(tx(byId(CNO_CHECKS,S.submitted.cnoCheck).text)):''))
      +R(tx(T.k.support),esc(tx(supportText(S.submitted.support))))
      +R(tx(T.k.move),esc(tx(moveTextOf(S.submitted.move))))
      +R(tx(T.k.pledge),esc(tx(pledgeText(S.submitted.pledge))))
    +'</table>'+rev
    +'<h2>'+esc(tx(T.sum.openedBefore))+'</h2>'+opened+notes
    +'<p class="m">'+esc(tx(T.sum.method))+'</p><p class="m">'+esc(tx(T.sum.note))+'</p>'
    +'<p class="noprint"><button onclick="print()">'+esc(tx(T.sum.print))+'</button></p></body></html>';
  try{
    var blob=new Blob([doc],{type:'text/html;charset=utf-8'});
    var url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download='credibility-decision-summary.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },3000);
    toast(tx(T.res.saved));
  }catch(e){ var w=window.open(); if(w){ w.document.write(doc); w.document.close(); } }
}

draw();
